'title': {'rendered': '5 Robot Programming Challenges'}, 


'content': {'rendered': '\t\t<div data-elementor-type="wp-post" 
data-elementor-id="2145" 
class="elementor elementor-2145" 
data-elementor-post-type="post">\n\t\t\t\t<div 
class="elementor-element elementor-element-834be75 e-flex e-con-boxed e-con e-parent" 
data-id="834be75" 
data-element_type="container">\n\t\t\t\t\t<div 
class="e-con-inner">\n\t\t\t\t<div 
class="elementor-element elementor-element-f2bd1e8 elementor-widget elementor-widget-heading" 
data-id="f2bd1e8" 
data-element_type="widget" 
data-widget_type="heading.default">\n\t\t\t\t<div 
class="elementor-widget-container">\n\t\t\t\t\t<h2 
class="elementor-heading-title elementor-size-default">Educational Experience with Robotics to Develop Computational Thinking Skills in a Secondary School: 5 Robot Programming Challenges\n</h2>\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t<div 
class="elementor-element elementor-element-409a5fbf elementor-widget elementor-widget-text-editor" 
data-id="409a5fbf" 
ata-element_type="widget" 
data-widget_type="text-editor.default">\n\t\t\t\t<div 
class="elementor-widget-container">\n\t\t\t\t\t\t\t\t\t\n<p 
class="wp-block-paragraph"><span style="color: #808080;"><strong>Alesio Sánchez Fernández</strong></span></p>\n<p>The study examines the importance of Computational Thinking (CT) in the educational context, particularly in developing competencies among secondary school students. It highlights how CT can help overcome educational barriers and promote inclusion, although challenges persist for students with special educational needs. The main objective is to demonstrate the effectiveness of CT, applied through robotics activities, in enhancing the skills of secondary school students, benefiting those with specific educational needs and adapting learning to be inclusive for all.</p>\n<p>
A quantitative experimental design with a pre-test and post-test was employed at IES Domenico Scarlatti in Aranjuez, involving 201 students in six sessions for the experimental group. The study concludes that there is significant learning progress among the girls in the experimental group, with notable improvements compared to their peers, although no significant progress was observed among students with special needs. The findings support the integration of CT into school curricula to prepare all students for future challenges, ensuring accessibility and equity in learning.</p>\n<p><a 
href="https://imaginatic.es/wp-content/uploads/2025/07/21.-Sec-mBot2-AlesioSanchez.Def-Ingles.pdf"><span style="text-decoration: underline; color: #0000ff;"><em>Dowload Educational Programme</em></span></a></p>\n<p>\xa0</p>\n<p>\xa0</p>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t<div class="elementor-element elementor-element-8abf568 e-flex e-con-boxed e-con e-parent" data-id="8abf568" data-element_type="container">\n\t\t\t\t\t<div class="e-con-inner">\n\t\t\t\t<div class="elementor-element elementor-element-c5c95ba e-n-tabs-mobile elementor-widget elementor-widget-n-tabs" data-id="c5c95ba" data-element_type="widget" data-settings="{&quot;horizontal_scroll&quot;:&quot;disable&quot;}" data-widget_type="nested-tabs.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t<div class="e-n-tabs" data-widget-number="207394234" aria-label="Pestañas. Abre elementos con Intro o Espacio, ciérralos con Escape y navega con las fechas.">\n\t\t\t<div class="e-n-tabs-heading" role="tablist">\n\t\t\t\t\t<button id="e-n-tab-title-2073942341" class="e-n-tab-title" aria-selected="true" data-tab-index="1" role="tab" tabindex="0" aria-controls="e-n-tab-content-2073942341" style="--n-tabs-title-order: 1;">\n\t\t\t\t\t\t<span class="e-n-tab-title-text">\n\t\t\t\tIntroduction \t\t\t</span>\n\t\t</button>\n\t\t\t\t<button id="e-n-tab-title-2073942342" class="e-n-tab-title" aria-selected="false" data-tab-index="2" role="tab" tabindex="-1" aria-controls="e-n-tab-content-2073942342" style="--n-tabs-title-order: 2;">\n\t\t\t\t\t\t<span class="e-n-tab-title-text">\n\t\t\t\tActivity design \t\t\t</span>\n\t\t</button>\n\t\t\t\t<button id="e-n-tab-title-2073942343" class="e-n-tab-title" aria-selected="false" data-tab-index="3" role="tab" tabindex="-1" aria-controls="e-n-tab-content-2073942343" style="--n-tabs-title-order: 3;">\n\t\t\t\t\t\t<span class="e-n-tab-title-text">\n\t\t\t\tImplementation\t\t\t</span>\n\t\t</button>\n\t\t\t\t<button id="e-n-tab-title-2073942344" class="e-n-tab-title" aria-selected="false" data-tab-index="4" role="tab" tabindex="-1" aria-controls="e-n-tab-content-2073942344" style="--n-tabs-title-order: 4;">\n\t\t\t\t\t\t<span class="e-n-tab-title-text">\n\t\t\t\tResults\t\t\t</span>\n\t\t</button>\n\t\t\t\t<button id="e-n-tab-title-2073942345" class="e-n-tab-title" aria-selected="false" data-tab-index="5" role="tab" tabindex="-1" aria-controls="e-n-tab-content-2073942345" style="--n-tabs-title-order: 5;">\n\t\t\t\t\t\t<span class="e-n-tab-title-text">\n\t\t\t\tConclusions\t\t\t</span>\n\t\t</button>\n\t\t\t\t<button id="e-n-tab-title-2073942346" class="e-n-tab-title" aria-selected="false" data-tab-index="6" role="tab" tabindex="-1" aria-controls="e-n-tab-content-2073942346" style="--n-tabs-title-order: 6;">\n\t\t\t\t\t\t<span class="e-n-tab-title-text">\n\t\t\t\tActivity Sheet\t\t\t</span>\n\t\t</button>\n\t\t\t\t\t</div>\n\t\t\t<div class="e-n-tabs-content">\n\t\t\t\t<div id="e-n-tab-content-2073942341" role="tabpanel" aria-labelledby="e-n-tab-title-2073942341" data-tab-index="1" style="--n-tabs-title-order: 1;" class="e-active elementor-element elementor-element-b9e07ab e-con-full e-flex e-con e-child" data-id="b9e07ab" data-element_type="container">\n\t\t\t\t<div class="elementor-element elementor-element-70af155 elementor-widget elementor-widget-text-editor" data-id="70af155" data-element_type="widget" data-widget_type="text-editor.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t\t\t<p>In the current educational context, Computational Thinking (CT) has proven to be an essential skill, with tangible benefits for students&#8217; academic development (Zapata-Ros, 2015; Lee et al., 2011). Numerous studies support the idea that CT enhances students&#8217; competencies, helping them to succeed in their subjects and achieve better results across various disciplines (Bocconi et al., 2016; Zapata-Cáceres &amp; Martín-Barroso, 2021).</p>\n<p>While academic literature has explored the impact of CT on students with high intellectual abilities and those with special educational needs separately, there remains a significant gap in understanding how this skill influences the development of students with special needs (learning difficulties, disabilities or gifted students). Therefore, it is crucial to design inclusive educational experiences that address the diversity of students found in classrooms (Buitrago et al., 2022; Frutos et al., 2012; Hontangas &amp; de la Puente, 2010).</p>\n<p>A practical experience was conducted to explore the relationship between CT, implemented through robotics activities, and diversity support in secondary school students. This experience encompassed a broad spectrum of students with specific educational support needs, aiming to identify the impact of CT across different levels within this spectrum. The significance of this research lies not only in understanding how CT influences students&#8217; skill development but also in examining the variations in its impact on students with special needs.</p>\t\t\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t<div id="e-n-tab-content-2073942342" role="tabpanel" aria-labelledby="e-n-tab-title-2073942342" data-tab-index="2" style="--n-tabs-title-order: 2;" class=" elementor-element elementor-element-70f5321 e-con-full e-flex e-con e-child" data-id="70f5321" data-element_type="container">\n\t\t\t\t<div class="elementor-element elementor-element-5e90da0 elementor-widget elementor-widget-text-editor" data-id="5e90da0" data-element_type="widget" data-widget_type="text-editor.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t\t\t<p>The activity was designed to be implemented over multiple sessions with secondary school students, using mBot2 educational robots. It targeted students in Years 9, 10, and 11 (2nd, 3rd, and 4th of ESO). The necessary resources included computers with the mBlock5<a href="#_ftn1" name="_ftnref1">[1]</a> program or the mLink2<a href="#_ftn2" name="_ftnref2">[2]</a> connector, mBot2<a href="#_ftn3" name="_ftnref3">[3]</a> robots, and additional materials such as printed circuits for line-following tasks. The methodology followed a quasi-experimental design, employing pre-test and post-test assessments to measure the impact of the robotics sessions on the development of Computational Thinking (CT).</p>\n<p>Data on CT development were collected using the CTt test (Román-González, 2015; Román-González, Pérez-González &amp; Jiménez-Fernández, 2017), which served as the evaluation instrument. The test was administered through an online form created with Microsoft Forms. Additionally, an anonymous survey was conducted to gather participants’ feedback on their experience, also using Microsoft Forms.</p>\n<p>The specific objectives of this study are outlined below, focusing on hypothesis validation and students’ academic development:</p>\n<ul>\n<li>To test the main hypothesis regarding the effectiveness of CT in improving secondary school students&#8217; competencies, regardless of their innate abilities.</li>\n<li>To evaluate the secondary hypothesis, which suggests that these activities have a more significant impact on students at the extremes of the NEAE spectrum.</li>\n<li>To promote the development of CT-related skills among participating students, including abstraction, algorithmic thinking, decomposition, debugging, automation, and generalization.</li>\n<li>To facilitate the learning of basic robotics concepts through the Scratch programming language and the use of programmable robots. Both robotics and Scratch are part of the secondary and A-level curriculum, and this study contributes to the development of these subjects.</li>\n</ul>\n<p>The experience was implemented in all classes that had sufficient time available for its completion, specifically in eight secondary school classes. Figure 1 presents a schematic overview of the six sessions conducted. While the control groups participated only in Sessions 1 and 6, the experimental groups completed all sessions. Students worked in the different activities proposed during sessions 2 to 5. The first and last sessions were used to answer a questionnaire by the participants.\xa0</p>\n<p>\xa0</p>\n<p><img loading="lazy" decoding="async" class="alignnone  wp-image-2162" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_25-300x217.jpg" alt="" width="400" height="289" srcset="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_25-300x217.jpg 300w, https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_25.jpg 381w" sizes="(max-width: 400px) 100vw, 400px" /></p>\n<p>Figure 1. Session outline</p>\n<p>\xa0</p>\n<p>Specifically, the following schedule is carried out:</p>\n<ol>\n<li>Initial Session</li>\n</ol>\n<ol>\n<li>Introduction to the practical experience (5-10 minutes)</li>\n<li>Pre-test (30-40 minutes)</li>\n</ol>\n<ol>\n<li>Movement Session</li>\n</ol>\n<ol>\n<li>A1: Basic movements – Drawing a simple figure with the robot’s trajectory (basic shapes) (25 minutes) (see details in Table 1).</li>\n<li>A2: Advanced movements – Drawing a more complex figure with the robot’s trajectory (one-stroke figures) (25 minutes) (see details in Table 2).</li>\n</ol>\n<ol>\n<li>Ultrasonic Sensor Session (A3): Avoiding obstacles to prevent collisions (20-25 minutes) (see details in Table 3).</li>\n<li>LED Interaction Session (A4)</li>\n</ol>\n<ol>\n<li>Displaying lights like the Knight Rider car (30 minutes) (see details in Table 4).<br />b. Introduction to the next session and its start (20 minutes).</li>\n</ol>\n<ol>\n<li>RGB Sensor Session (A5): Line tracking (50 minutes) (see details in Table 5).</li>\n<li>Final Session</li>\n</ol>\n<ol>\n<li>Post-test (30-40 minutes). Final questionnaire to validate progress.</li>\n<li>Satisfaction survey (10 minutes). Evaluation of the experience.</li>\n</ol>\n<p>The organization of the sessions in each class is done by forming 5 working groups that remain constant throughout all sessions. The groups are as balanced as possible in terms of gender and abilities, ensuring a mix of boys and girls in all groups and distributing students of different abilities. There are 5 groups because there are 5 robots for the activities, so the groups are mostly made up of 4 or 5 students, with some cases where there might be 3 or 6 students depending on the number of students in the class.</p>\n<p>Below is the detailed list of activities to be carried out, as presented to the students, indicating the objectives, the computer skills worked on in each of them, additional information, and their solutions.</p>\n<p><a href="#_ftnref1" name="_ftn1"></a></p>\n<p><a href="#_ftnref1" name="_ftn1">[1]</a> <a href="https://mblock.cc/">https://mblock.cc/</a></p>\n<p><a href="#_ftnref2" name="_ftn2">[2]</a> <a href="https://mblock.cc/pages/downloads">https://mblock.cc/pages/downloads</a></p>\n<p><a href="#_ftnref3" name="_ftn3">[3]</a> <a href="https://www.makeblock.com/pages/mbot2-coding-robot">https://www.makeblock.com/pages/mbot2-coding-robot</a><a href="#_ftnref2" name="_ftn2"></a></p>\n<p>Table 1. First Activity &#8211; Basic Movements.</p>\n<table width="935">\n<tbody>\n<tr>\n<td colspan="3" width="935">\n<p><strong>A1. Basic Movements: Simple Figure</strong></p>\n</td>\n</tr>\n<tr>\n<td width="283">\n<p><strong>Objetive</strong></p>\n</td>\n<td width="227">\n<p><strong>Computer skills worked on</strong></p>\n</td>\n<td width="425">\n<p><strong>Additional information</strong></p>\n</td>\n</tr>\n<tr>\n<td width="283">\n<p>The robot must describe a trajectory that draws a simple geometric figure assigned to the group.</p>\n<p>\xa0</p>\n<p>\xa0</p>\n<p>\xa0</p>\n<p>\xa0</p>\n</td>\n<td width="227">\n<p>Abstraction, algorithmic thinking, and debugging.</p>\n<p>\xa0</p>\n</td>\n<td width="425">\n<p>Figures to be created by each work group:</p>\n<p>·\xa0\xa0\xa0\xa0\xa0\xa0\xa0\xa0 Group 1: Square with a side length of 40 cm.</p>\n<p>·\xa0\xa0\xa0\xa0\xa0\xa0\xa0\xa0 Group 2: Equilateral triangle with a side length of 40 cm.</p>\n<p>·\xa0\xa0\xa0\xa0\xa0\xa0\xa0\xa0 Group 3: Rectangle with a long side of 40 cm and a short side of 20 cm.</p>\n<p>·\xa0\xa0\xa0\xa0\xa0\xa0\xa0\xa0 Group 4: Pentagon with a side length of 30 cm.</p>\n<p>·\xa0\xa0\xa0\xa0\xa0\xa0\xa0\xa0 Group 5: Hexagon with a side length of 25 cm.</p>\n</td>\n</tr>\n<tr>\n<td colspan="3" width="935">\n<p><strong>Solution</strong></p>\n</td>\n</tr>\n<tr>\n<td colspan="3" width="935">\n<p>In Figure 2, an example of a solution is shown, which works for any of the requested regular figures (square, triangle, pentagon, and hexagon), as well as for any regular figure that is to be created. One only needs to specify the number of sides (4 in the example) and the length of each side (40 in the example). In Figure 3, an example of a solution for drawing the rectangle is shown. These solutions are general, allowing for easy modification of the result, but students typically use the simpler method of indicating repetitions and values directly in the instructions.</p>\n<p><img loading="lazy" decoding="async" class="alignnone size-medium wp-image-2173" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_28-300x203.jpg" alt="" width="300" height="203" srcset="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_28-300x203.jpg 300w, https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_28.jpg 404w" sizes="(max-width: 300px) 100vw, 300px" /></p>\n<p>Figure 2. Basic Movements: Simple Figure. Solution for regular figures.</p>\n<p><img loading="lazy" decoding="async" class="alignnone size-medium wp-image-2174" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_29-300x188.jpg" alt="" width="300" height="188" srcset="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_29-300x188.jpg 300w, https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_29.jpg 427w" sizes="(max-width: 300px) 100vw, 300px" /></p>\n<p>Figure 3. Basic Movements: Simple Figure. Solution for the rectangle activity.</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p>Table 2 &#8211; Second Activity &#8211; Advanced Movements.</p>\n<table width="935">\n<tbody>\n<tr>\n<td colspan="3" width="935">\n<p><strong>A2. Advanced Movements: Complex Figure</strong></p>\n</td>\n</tr>\n<tr>\n<td width="245">\n<p><strong>Objetive</strong></p>\n</td>\n<td width="302">\n<p><strong>Computer skills worked on</strong></p>\n</td>\n<td width="387">\n<p><strong>Additional information</strong></p>\n</td>\n</tr>\n<tr>\n<td width="245">\n<p>The robot must describe a trajectory that draws a single-stroke figure assigned to the group.</p>\n</td>\n<td width="302">\n<p>Abstraction, algorithmic thinking, and debugging.</p>\n</td>\n<td width="387">\n<p>Figures to be created by each work group. Figure 4 presents the assignment of more complex geometric figures to each work group with the goal of working on more advanced movements.</p>\n</td>\n</tr>\n<tr>\n<td colspan="3" width="935">\n<p><strong>Solution</strong></p>\n</td>\n</tr>\n<tr>\n<td colspan="3" width="935">\n<p>For this exercise, it is ideal for students to plan the movements on paper first and then transfer them to the program. They should first think about the solution to the problem and then figure out how to implement it in the program.</p>\n<p><img loading="lazy" decoding="async" class="alignnone size-medium wp-image-2175" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_30-300x173.jpg" alt="" width="300" height="173" srcset="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_30-300x173.jpg 300w, https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_30.jpg 410w" sizes="(max-width: 300px) 100vw, 300px" /></p>\n<p>Figure 4. Geometric Figures for Working on Advanced Movements with the Robot.</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p>Table 3 &#8211; Third Activity &#8211; Avoiding Obstacles.</p>\n<table width="935">\n<tbody>\n<tr>\n<td colspan="3" width="935">\n<p><strong>A3. Ultrasonic Sensor: Avoiding Obstacles</strong></p>\n</td>\n</tr>\n<tr>\n<td width="321">\n<p><strong>Objetive</strong></p>\n</td>\n<td width="217">\n<p><strong>Computer skills worked on</strong></p>\n</td>\n<td width="397">\n<p><strong>Additional information</strong></p>\n</td>\n</tr>\n<tr>\n<td width="321">\n<p>The robot must avoid any obstacles it encounters in its path.</p>\n</td>\n<td width="217">\n<p>Abstraction, algorithmic thinking, decomposition, and debugging.</p>\n</td>\n<td width="397">\n<p>§\xa0 Detect at a certain distance.</p>\n<p>§\xa0 Use the «Forever» block.</p>\n<p>§\xa0 Choose what to do when an obstacle is detected.</p>\n</td>\n</tr>\n<tr>\n<td colspan="3" width="935">\n<p><strong>Solution</strong></p>\n</td>\n</tr>\n<tr>\n<td colspan="3" width="935">\n<p>Figure 5 shows an example of a solution for this activity. Typically, students make the robot turn in the same direction whenever an obstacle is encountered. Once this is achieved, they can be asked to make the robot turn randomly to either side, with a different turning angle each time.</p>\n<p><strong> <img loading="lazy" decoding="async" class="alignnone size-medium wp-image-2176" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_31-300x272.jpg" alt="" width="300" height="272" srcset="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_31-300x272.jpg 300w, https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_31.jpg 553w" sizes="(max-width: 300px) 100vw, 300px" /></strong></p>\n<p>Figure 5 &#8211; Solution to Activity 3: Avoiding Obstacles.</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p>Table 4 &#8211; Fourth Activity &#8211; LEDs as «Knight Rider» Kit.</p>\n<table width="935">\n<tbody>\n<tr>\n<td colspan="3" width="935">\n<p><strong>A4. LEDs: «Kit» Light (Knight Rider Car)</strong></p>\n</td>\n</tr>\n<tr>\n<td width="302">\n<p><strong>Objetive</strong></p>\n</td>\n<td width="265">\n<p><strong>Computer skills worked on</strong></p>\n</td>\n<td width="369">\n<p><strong>Additional information</strong></p>\n</td>\n</tr>\n<tr>\n<td width="302">\n<p>It must display the back-and-forth movement of lights like the Knight Rider car, similar to the one shown in Figure 6.</p>\n<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-2177" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_32.jpg" alt="" width="282" height="174" /></p>\n<p><a name="_Toc168259766"></a>Figure 6. Image of the Knight Rider car lights.<br />Fuente: qkbestet.pics</p>\n</td>\n<td width="265">\n<p>Abstraction, algorithmic thinking, automation, and decomposition.\xa0\xa0</p>\n</td>\n<td width="369">\n<p>Figures to be created by each work group:</p>\n<p>·\xa0\xa0\xa0\xa0\xa0\xa0\xa0\xa0 Use the «LED» instruction block.</p>\n<p>·\xa0\xa0\xa0\xa0\xa0\xa0\xa0\xa0 Start with the movement of a single LED, aiming for a smooth motion.</p>\n</td>\n</tr>\n<tr>\n<td colspan="3" width="935">\n<p><strong>Solution</strong></p>\n</td>\n</tr>\n<tr>\n<td colspan="3" width="935">\n<p>Figure 7 shows a simple solution, for example, moving 2 LEDs without leaving a trail. Typically, students begin by initializing the light to display each time (the first one that appears in the figure after pressing button B) in a different position. This solution is not very effective, so the next step is to ask them to create a code that can be easily modified to be valid for any length of the LED strip, not just the 5-LED strip shown. An additional improvement for more advanced students would be to try doing it while viewing the trail.</p>\n<p><img loading="lazy" decoding="async" class="alignnone size-medium wp-image-2178" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_33-300x268.jpg" alt="" width="300" height="268" srcset="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_33-300x268.jpg 300w, https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_33.jpg 575w" sizes="(max-width: 300px) 100vw, 300px" /></p>\n<p>Figure 7 &#8211; Solution to Activity 4: Kit Light.</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p><a name="_Toc168259799"></a>Table 5 &#8211; Fifth Activity &#8211; Line Following.</p>\n<table width="935">\n<tbody>\n<tr>\n<td colspan="3" width="935">\n<p><strong>A5. RGB Sensor: Line Following</strong></p>\n</td>\n</tr>\n<tr>\n<td width="227">\n<p><strong>Objetive</strong></p>\n</td>\n<td width="246">\n<p><strong>Computer skills worked on</strong></p>\n</td>\n<td width="463">\n<p><strong>Additional information</strong></p>\n</td>\n</tr>\n<tr>\n<td width="227">\n<p>The robot must find the black line and continuously follow it along the entire path.</p>\n</td>\n<td width="246">\n<p>Abstraction, algorithmic thinking, decomposition, debugging, automation, and generalization.</p>\n</td>\n<td width="463">\n<p>There are 4 sensors in the mBot2, as shown in Figure 8. The L1 and R1 sensors must be used.</p>\n<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-2182" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_34.jpg" alt="" width="238" height="125" /></p>\n<p>Figure 8. RGB Sensors of the mBot2.</p>\n<p>Use the «Forever» block.\xa0</p>\n<p>Use «detect line» in the instructions instead of detecting a specific color.\xa0</p>\n<p>Pay attention to the motor rotation direction if that instruction is used. See the direction of rotation for each wheel in Figure 9.</p>\n<p><img loading="lazy" decoding="async" class="alignnone size-medium wp-image-2184" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_35-300x111.jpg" alt="" width="300" height="111" srcset="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_35-300x111.jpg 300w, https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_35.jpg 329w" sizes="(max-width: 300px) 100vw, 300px" /></p>\n<p><a name="_Toc168259769"></a>Figure 9. Direction of Motor Rotation in the mBot2.</p>\n<p>Use logical operations according to the 4 detection states of the 2 sensors with the line, as indicated in Figure 10.</p>\n<p><img loading="lazy" decoding="async" class="alignnone size-medium wp-image-2183" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_36-300x95.jpg" alt="" width="300" height="95" srcset="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_36-300x95.jpg 300w, https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_36.jpg 398w" sizes="(max-width: 300px) 100vw, 300px" /></p>\n<p>Figure 10. Logical Operations of the 4 States. Source: Author&#8217;s own creation.</p>\n</td>\n</tr>\n<tr>\n<td colspan="3" width="935">\n<p><strong>Solution</strong></p>\n</td>\n</tr>\n<tr>\n<td colspan="3" width="935">\n<p>Figure 11 shows a simple solution for this activity. Typically, students start by making small 1° turns for the curves and then check again. This causes the robot to spin in place, giving no sense of forward motion in the curves. Once this is achieved, they can be asked to make the curves smoother, allowing the robot to maintain its sense of forward progress. Finally, they could do it at a higher speed and perform some action upon detecting a color on the line.</p>\n<p><img loading="lazy" decoding="async" class="alignnone  wp-image-2185" src="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_37-300x150.jpg" alt="" width="348" height="174" srcset="https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_37-300x150.jpg 300w, https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_37-768x384.jpg 768w, https://imaginatic.es/wp-content/uploads/2025/07/Screenshot_37.jpg 887w" sizes="(max-width: 348px) 100vw, 348px" /></p>\n<p>Figure 11 &#8211; Solution to Activity 5: Line Following.</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p>\xa0</p>\n<p>\xa0</p>\n<p>\xa0</p>\n<p>\xa0</p>\n<p>\xa0</p>\n<p>\xa0</p>\n<p>\xa0</p>\t\t\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t<div id="e-n-tab-content-2073942343" role="tabpanel" aria-labelledby="e-n-tab-title-2073942343" data-tab-index="3" style="--n-tabs-title-order: 3;" class=" elementor-element elementor-element-1e999fa e-con-full e-flex e-con e-child" data-id="1e999fa" data-element_type="container">\n\t\t\t\t<div class="elementor-element elementor-element-be6fd04 elementor-widget elementor-widget-text-editor" data-id="be6fd04" data-element_type="widget" data-widget_type="text-editor.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t\t\t<p>The experience was carried out at the IES Domenico Scarlatti in Aranjuez, Madrid, during the 2023/2024 academic year, with the participation of 201 students. The students were divided into control and experimental groups, with the experimental group carrying out the robotics sessions. The sessions took place in classrooms equipped for this purpose and were conducted in collaborative work groups. The student population included students with specific educational support needs.</p>\n<p>The control group consisted of 84 participants from 2nd and 3rd year of Secondary Education (ESO), while the experimental group included 117 participants from 2nd, 3rd, and 4th year of ESO. The classes belonging to the control and experimental groups were the students&#8217; natural classes and were selected by the educational center itself.</p>\n<p>As the participants were minors, explicit consent was obtained through signed permission from the students&#8217; parents or guardians to conduct the study. Furthermore, this study has been authorized by the Research Ethics Committee of the Rey Juan Carlos University, with registration number 281120234182023</p>\t\t\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t<div id="e-n-tab-content-2073942344" role="tabpanel" aria-labelledby="e-n-tab-title-2073942344" data-tab-index="4" style="--n-tabs-title-order: 4;" class=" elementor-element elementor-element-99cf5e7 e-flex e-con-boxed e-con e-child" data-id="99cf5e7" data-element_type="container">\n\t\t\t\t\t<div class="e-con-inner">\n\t\t\t\t<div class="elementor-element elementor-element-2ccbe80 elementor-widget elementor-widget-text-editor" data-id="2ccbe80" data-element_type="widget" data-widget_type="text-editor.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t\t\t<p>The main results of the activity showed that the experimental group experienced meaningful learning in computer skills, particularly among girls (Wilcoxon test; p = 0.0003031), who showed significant improvements compared to their male peers and the control group (boys in the experimental group: p = 0.8316; boys in the control group: p = 0.7588; girls in the control group: p = 0.8644). These findings suggest that meaningful learning in the experimental group occurred primarily among the girls. Figure 12 visually displays these results, where the means of the control and experimental groups, segmented by gender, can be observed in the pre- and post-tests of the experience.</p>\n<p><img loading="lazy" decoding="async" class="alignnone  wp-image-2189" src="https://imaginatic.es/wp-content/uploads/2025/07/Imagen1-300x191.png" alt="" width="340" height="217" srcset="https://imaginatic.es/wp-content/uploads/2025/07/Imagen1-300x191.png 300w, https://imaginatic.es/wp-content/uploads/2025/07/Imagen1.png 482w" sizes="(max-width: 340px) 100vw, 340px" /></p>\n<p>Figure 12. Graph showing the means of the control and experimental groups segmented by gender.</p>\n<p>\xa0</p>\n<p>In the analysis of the NEAE subgroup, consisting of 10 students in the control group and 14 in the experimental group, the Wilcoxon test for paired samples was used due to the small sample size (less than 35). This method is appropriate for evaluating differences in measurements taken at two different time points.</p>\n<p>The results indicate that no significant improvements were observed in the performance of special needs students in either group (p = 0.4136 in the experimental group and p = 0.7907 in the control group). These findings suggest the need for a more in-depth analysis to identify potential patterns or effects that might not be evident through conventional statistical tests. An additional approach could reveal subtle influences that, although not statistically significant, may have pedagogical relevance.</p>\n<p>These conclusions support the integration of computer skills activities into school curricula as an essential tool for improving students&#8217; competencies.</p>\t\t\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t<div id="e-n-tab-content-2073942345" role="tabpanel" aria-labelledby="e-n-tab-title-2073942345" data-tab-index="5" style="--n-tabs-title-order: 5;" class=" elementor-element elementor-element-83076ad e-flex e-con-boxed e-con e-child" data-id="83076ad" data-element_type="container">\n\t\t\t\t\t<div class="e-con-inner">\n\t\t\t\t<div class="elementor-element elementor-element-125eb76 elementor-widget elementor-widget-text-editor" data-id="125eb76" data-element_type="widget" data-widget_type="text-editor.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t\t\t<p>The activity demonstrated that robotics sessions can be effective in developing computer skills in Secondary Education (ESO) students, particularly among girls. Although no significant improvements were found in students with special needs, the activity provides a solid foundation for future research and adjustments in the design of activities to enhance their inclusion and effectiveness. It is essential to continue exploring and adapting these activities to ensure that all students can benefit from them.</p>\n<p><strong>\xa0</strong></p>\n<p><strong>Funding</strong></p>\n<p>The materials for the execution of this activity have been funded by the Erasmus+ CoTEDI project, which is funded by the European Union under Key Action 2023-1-NL01-KA220-SCH-000152037 – OID E10207981.</p>\n<p><strong>\xa0</strong></p>\n<p><strong>Acknowledgements</strong></p>\n<p>I would like to thank my TFM supervisors, Estefanía Martín Barroso and María Zapata Cáceres, for their support and guidance throughout the development of this project.</p>\n<p><strong>\xa0</strong></p>\n<p><strong>References</strong></p>\n<p>Bocconi, S., Chioccariello, A., Giuliana, D., Ferrari, A., &amp; Engelhardt, K. (2016). Developing Computational Thinking in Compulsory Education &#8211; Implications for policy and practice. JRC Research Reports JRC104188, Joint Research Centre. Handle: RePEc:ipt:iptwpa:jrc104188.</p>\n<p>Buitrago, L. M., Laverde, G. M., Amaya, L. Y., &amp; Hernández, S. I. (2022). Pensamiento computacional y educación STEM: Reflexiones para una educación inclusiva desde las prácticas pedagógicas. Panorama, 16(30), pp. 233-257. DOI: 10.15765/pnrm.v16i30.3134.</p>\n<p>Frutos, A. E., Ruíz, A. B. M., Sánchez, J. J. M., Rus, T. I., Hidalgo, J. I. L., Sánchez, N. O., &amp; Martín, M. S. (2012). La atención a la diversidad: la educación inclusiva. Revista Electronica Interuniversitaria de Formación del Profesorado, 15(1), pp. 135-144. Disponible en: https://bit.ly/3FmUPYw.</p>\n<p>Hontangas, N. A., &amp; de la Puente, J. L. B. (2010). Atención a la diversidad y desarrollo de procesos educativos inclusivos. Prisma social, (4), pp.1-37. Disponible en: https://bit.ly/3FlHK1o.</p>\n<p>Lee, I., Martin, F., Denner, J., Coulter, B., Allan, W. C., Erickson, J., Malyn-Smith, J., &amp; Werner, L. (2011). Computational Thinking for Youth in practice. ACM Inroads, 2(1), pp. 32-37. DOI: 10.1145/1929887.1929902</p>\n<p>Román González, M. (2015). Computational thinking test: Design guidelines and content validation. In EDULEARN15 Proceedings, pp. 2436-2444. IATED. DOI: 10.13140/RG.2.1.4203.4329</p>\n<p>Román-González, M., Pérez-González, J., &amp; Jiménez-Fernández, C. (2017). Which cognitive abilities underlie computational thinking? Criterion Validity of the Computational Thinking test. Computers in Human Behavior, 72, pp. 678-691. DOI: 10.1016/j.chb.2016.08.047</p>\n<p>Zapata-Cáceres, M., &amp; Martín, E. (2021). Applying Game Learning Analytics to a Voluntary Video Game: Intrinsic Motivation, Persistence, and Rewards in Learning to Program at an Early Age. IEEE Access, 9, pp. 123588-123602. DOI: 10.1109/access.2021.3110475</p>\n<p>Zapata-Ros, M. (2015). Pensamiento computacional: Una nueva alfabetización digital. RED. Revista de Educación a Distancia, 46. DOI: 10.6018/red/46/4</p>\t\t\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t<div id="e-n-tab-content-2073942346" role="tabpanel" aria-labelledby="e-n-tab-title-2073942346" data-tab-index="6" style="--n-tabs-title-order: 6;" class=" elementor-element elementor-element-8a6d927 e-flex e-con-boxed e-con e-child" data-id="8a6d927" data-element_type="container">\n\t\t\t\t\t<div class="e-con-inner">\n\t\t\t\t<div class="elementor-element elementor-element-e97bcba elementor-widget elementor-widget-text-editor" data-id="e97bcba" data-element_type="widget" data-widget_type="text-editor.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t\t\t<table width="671">\n<tbody>\n<tr>\n<td width="198">\n<p><strong>EP title</strong></p>\n</td>\n<td width="473">\n<p><strong>Educational experience with robotics to develop Computational Thinking skills in a secondary school</strong></p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Author</p>\n</td>\n<td width="473">\n<p>Alesio Sánchez Fernández</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Name of Educational Center</p>\n</td>\n<td width="473">\n<p>IES Domenico Scarlatti</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Status</p>\n</td>\n<td width="473">\n<p>Done</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Start Date</p>\n</td>\n<td width="473">\n<p>08/01/2024</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>End Date</p>\n</td>\n<td width="473">\n<p>23/02/2024</p>\n</td>\n</tr>\n<tr>\n<td colspan="2" width="671">\n<p><strong>Target groups</strong></p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Age range of students</p>\n</td>\n<td width="473">\n<p>12-15</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Grade level</p>\n</td>\n<td width="473">\n<p>ESO (secondary education)</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Number of students involved</p>\n</td>\n<td width="473">\n<p>201</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Educational context</p>\n</td>\n<td width="473">\n<p>Computer room with computers</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Diversity</p>\n</td>\n<td width="473">\n<p>Includes 24 participants with special needs: learning difficulties, disabilities and high cognitive abilities.</p>\n</td>\n</tr>\n<tr>\n<td colspan="2" width="671">\n<p><strong>Required resources</strong></p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>WiFi connection is required</p>\n</td>\n<td width="473">\n<p>Yes</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Devices</p>\n</td>\n<td width="473">\n<p>Computers and mBot2 educational robots.</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Tangible materials</p>\n</td>\n<td width="473">\n<p>Printed circuit on paper for line tracking.</p>\n</td>\n</tr>\n<tr>\n<td colspan="2" width="671">\n<p><strong>Activity description</strong></p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Activity Description</p>\n</td>\n<td width="473">\n<p>The educational program consists of 5 activities:</p>\n<p>§\xa0 Draw a simple figure with the robot&#8217;s movement.</p>\n<p>§\xa0 Draw a complex figure with the robot.</p>\n<p>§\xa0 Avoid obstacles using the ultrasonic sensor.</p>\n<p>§\xa0 Use the LEDs to simulate the light of the «Knight Rider» car kit.</p>\n<p>§\xa0 Line tracking with the RGB sensor.</p>\n<p>The details of these activities have been included in the activity design section of this document.</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Total time needed</p>\n</td>\n<td width="473">\n<p>4 classes for the robotics activities and another two classes to complete the computational thinking tests. The details can be seen in the planning of Figure 1.</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Subject(s)</p>\n</td>\n<td width="473">\n<p>Technology and Digitalization.</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Specific topic addressed</p>\n</td>\n<td width="473">\n<p>Abstraction, algorithmic thinking, decomposition, debugging, automation, and generalization.</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Plugged / Unplugged</p>\n</td>\n<td width="473">\n<p>Plugged (robots)</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Type of Activity</p>\n</td>\n<td width="473">\n<p>Educational robotics with Scratch-based programming environment</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Individual / Collaborative.</p>\n</td>\n<td width="473">\n<p>Collaborative: groups of 3 to 6 members</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Level of creativity</p>\n</td>\n<td width="473">\n<p>Low</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Level of technology</p>\n</td>\n<td width="473">\n<p>Medium</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Computational skills worked and how they are developed</p>\n</td>\n<td width="473">\n<p>§\xa0 Abstraction</p>\n<p>§\xa0 Pattern recognition</p>\n<p>§\xa0 Problem decomposition</p>\n<p>§\xa0 Generalization</p>\n<p>§\xa0 Algorithmic thinking</p>\n<p>§\xa0 Evaluation</p>\n<p>§\xa0 Error detection</p>\n</td>\n</tr>\n<tr>\n<td colspan="2" width="671">\n<p><strong>Activity protocol and guidelines </strong></p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Activity Protocol and Guidelines</p>\n</td>\n<td width="473">\n<p>The activity followed a structured process that included problem analysis, identification of the robot&#8217;s instructions and functions, and solution design. Students engaged in block-based programming to implement their solutions, followed by practical testing with the robot to observe its behaviour. They also performed error debugging and made applicable improvements based on test results. Each activity was allocated 50 minutes, except for the two figure-drawing activities, which together took a total of 50 minutes.</p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Teacher Training</p>\n</td>\n<td width="473">\n<p>Knowledge of Scratch is required, and general knowledge of robots is recommended.</p>\n</td>\n</tr>\n<tr>\n<td colspan="2" width="671">\n<p><strong>Inclusion</strong></p>\n</td>\n</tr>\n<tr>\n<td width="198">\n<p>Adaptation for Special Needs</p>\n</td>\n<td width="473">\n<p>No special adaptations have been made to the activities, but they would be advisable. In the case of high-ability students, a greater challenge would be recommended by increasing the complexity of the activity itself. In the case of students with special educational needs, adaptations should be made according to each student&#8217;s specific needs, dedicating more time, providing more detailed explanations, etc.</p>\n</td>\n</tr>\n<tr>\n<td colspan="2" width="671">\n<p><strong>Additional details</strong></p>\n</td>\n</tr>\n<tr>\n<td colspan="2" width="671">\n<p>The main problems identified have been:\xa0</p>\n<p>§\xa0 Lack of attention and understanding.\xa0</p>\n<p>§\xa0 Low capacity for abstraction.\xa0</p>\n<p>§\xa0 Difficulty in refining and building on acquired experience.\xa0</p>\n<p>The proposed improvements are:\xa0</p>\n<p>§\xa0 Adaptations of activities for gifted students and students with learning difficulties.\xa0</p>\n<p>§\xa0 Extending the duration of activities (number of sessions and number of tasks).\xa0</p>\n<p>§\xa0 Smaller working groups (preferably individual work) and more suitable classrooms.</p>\n</td>\n</tr>\n</tbody>\n</table>\t\t\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t</div>\n\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t<div class="elementor-element elementor-element-2e818d0 e-flex e-con-boxed e-con e-parent" data-id="2e818d0" data-element_type="container">\n\t\t\t\t\t<div class="e-con-inner">\n\t\t\t\t<div class="elementor-element elementor-element-7f3260e elementor-widget elementor-widget-spacer" data-id="7f3260e" data-element_type="widget" data-widget_type="spacer.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t<div class="elementor-spacer">\n\t\t\t<div class="elementor-spacer-inner"></div>\n\t\t</div>\n\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t<div class="elementor-element elementor-element-3214286 e-flex e-con-boxed e-con e-parent" data-id="3214286" data-element_type="container">\n\t\t\t\t\t<div class="e-con-inner">\n\t\t\t\t<div class="elementor-element elementor-element-4b6f4e7 elementor-widget elementor-widget-image" data-id="4b6f4e7" data-element_type="widget" data-widget_type="image.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t<img loading="lazy" decoding="async" width="800" height="173" src="https://imaginatic.es/wp-content/uploads/2025/07/output-1024x222.png" class="attachment-large size-large wp-image-2158" alt="" srcset="https://imaginatic.es/wp-content/uploads/2025/07/output-1024x222.png 1024w, https://imaginatic.es/wp-content/uploads/2025/07/output-300x65.png 300w, https://imaginatic.es/wp-content/uploads/2025/07/output-768x166.png 768w, https://imaginatic.es/wp-content/uploads/2025/07/output-1536x332.png 1536w, https://imaginatic.es/wp-content/uploads/2025/07/output.png 1900w" sizes="(max-width: 800px) 100vw, 800px" />\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t<div class="elementor-element elementor-element-18f8883 e-flex e-con-boxed e-con e-parent" data-id="18f8883" data-element_type="container">\n\t\t\t\t\t<div class="e-con-inner">\n\t\t\t\t<div class="elementor-element elementor-element-32395a1 elementor-widget elementor-widget-spacer" data-id="32395a1" data-element_type="widget" data-widget_type="spacer.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t<div class="elementor-spacer">\n\t\t\t<div class="elementor-spacer-inner"></div>\n\t\t</div>\n\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t', 'protected': False}, 'excerpt': {'rendered': '<p>The study examines the importance of Computational Thinking (CT) in the educational context, particularly in developing competencies among secondary school students. It highlights how CT can help overcome educational barriers and promote inclusion, although challenges persist for students with special educational needs. The main objective is to demonstrate the effectiveness of CT, applied through robotics activities, in enhancing the skills of secondary school students, benefiting those with specific educational needs and adapting learning to be inclusive for all.</p>\n', 'protected': False}, 'author': 3, 'featured_media': 2146, 'comment_status': 'closed', 'ping_status': 'open', 'sticky': False, 'template': '', 'format': 'standard', 'meta': {'footnotes': ''}, 'categories': [70], 'tags': [], 'class_list': ['post-2145', 'post', 'type-post', 'status-publish', 'format-standard', 'has-post-thumbnail', 'hentry', 'category-pagcotedi-eps'], 'yoast_head': '<!-- This site is optimized with the Yoast SEO plugin v26.2 - https://yoast.com/wordpress/plugins/seo/ -->\n<title>Multiplier event - Spain - imaginatic</title>\n<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />\n<link rel="canonical" href="https://imaginatic.es/multiplier-event-spain/" />\n<meta property="og:locale" content="es_ES" />\n<meta property="og:type" content="article" />\n<meta property="og:title" content="Multiplier event - Spain - imaginatic" />\n<meta property="og:description" content="The Netherlands" />\n<meta property="og:url" content="https://imaginatic.es/multiplier-event-spain/" />\n<meta property="og:site_name" content="imaginatic" />\n<meta property="article:published_time" content="2025-11-30T10:11:30+00:00" />\n<meta property="article:modified_time" content="2025-11-30T10:26:53+00:00" />\n<meta property="og:image" content="ht