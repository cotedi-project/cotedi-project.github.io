'title': {'rendered': 'Multiplier event &#8211; Spain'}, 
'content': {'rendered': '\t\t<div data-elementor-type="wp-post" data-elementor-id="2374" class="elementor elementor-2374" data-elementor-post-type="post">\n\t\t\t\t<div class="elementor-element elementor-element-ea6febf e-flex e-con-boxed e-con e-parent" data-id="ea6febf" data-element_type="container">\n\t\t\t\t\t<div class="e-con-inner">\n\t\t\t\t<div class="elementor-element elementor-element-2c4cf27 elementor-widget elementor-widget-text-editor" data-id="2c4cf27" data-element_type="widget" data-widget_type="text-editor.default">\n\t\t\t\t<div class="elementor-widget-container">\n\t\t\t\t\t\t\t\t\t<h1>\xa0</h1><h1>CoTEDI Multiplier Event in Spain</h1><p data-start="207" data-end="590">The MultiplierEvent in Madrid (Spain) on 2 December 2025 brings together teachers, researchers, and professionals interested in computational thinking as part of the Erasmus+ CoTEDI project. Hostedby the Spanish partner at Universidad Rey Juan Carlos (URJC), the event provides a space for sharing practical approaches to integrating computational thinking in educational settings.</p><p data-start="592" data-end="1043">Alongside the public programme, the CoTEDI partners meet in Madrid to continue the project’s collaborative work. On the morning of 2 December, the consortium visits CEIP Pedro Duque —also a project partner— to observe the school context and discuss ongoing activities. The partners also hold a working meeting on 3 December to review the project results achieved so far and plan the next steps, including the upcoming hackathon scheduled for February.</p><p data-start="1045" data-end="1587">The Multiplier Event programme includes presentations featuring real classroom experiences and resources to support the development of computational thinking in early childhood, primary, secondary, and upper-secondary education. A strong emphasis is placed on inclusion and diversity, with sessions showcasing both unplugged and digital activities that can be applied across different school contexts. Participants also have access to practical ideas, materials, and references from the project to support implementation in their own centres.</p><p data-start="1589" data-end="1828">The event also features the CoTEDI Challenge: Computational Thinking in the Classroom, an open call in which educators can voluntarily share their teaching experiences. Theprogramme closes with the awards ceremony of the CoTEDI Challenge.</p><p data-start="1830" data-end="2075" data-is-last-node="" data-is-only-node="">This Multiplier Event serves to disseminate the project’s outcomes and to strengthen a collaborative network of educators committed to advancing computational thinking through inclusive and innovative practices. Registration is free.</p><p data-start="1228" data-end="1380">📅 <strong data-start="1231" data-end="1240">Dates</strong>: December 02-03, 2025<br data-start="1262" data-end="1265" />📍 <strong data-start="1268" data-end="1280">Location</strong>: Universidad Rey Juan Carlos, Madrid</p><p data-start="1228" data-end="1380"><a href="https://eventos.urjc.es/user/myevents.html" target="_blank" rel="noopener">More information:\xa0https://eventos.urjc.es/user/myevents.html</a></p><p data-start="1228" data-end="1380"><a href="https://imaginatic.es/wp-content/uploads/2025/11/PROGRAM_CoTEDI_event_english.pdf">Download: PROGRAM_CoTEDI_event_english</a></p><p data-start="1228" data-end="1380"><a href="https://imaginatic.es/wp-content/uploads/2025/11/PROGRAMA_EventoMultiplicadorCotedi.pdf">Download: PROGRAMA_EventoMultiplicadorCotedi</a></p><p data-start="1228" data-end="1380">\xa0</p>\t\t\t\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t<div class="elementor-element elementor-element-d50e1ee e-flex e-con-boxed e-con e-parent" data-id="d50e1ee" data-element_type="container">\n\t\t\t\t\t<div class="e-con-inner">\n\t\t\t\t<div class="elementor-element elementor-element-b540718 elementor-widget elementor-widget-image" data-id="b540718" data-element_