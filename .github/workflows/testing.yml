# Simple workflow for deploying static content to GitHub Pages
name: Check if PR is ready for review

on:
  push:
    branches:
      - debug
  pull_request:
    types:
    - opened
    - edited
    - synchronize
    - ready_for_review
    branches:
    - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: setup dependencies
        run: npm ci
      - name: lint JS and CSS
        run: npm run lint
      - name: Debug remote images
        run: |
          mkdir -p /tmp/imgcheck
          urls=(
            "https://imaginatic.es/wp-content/uploads/2025/07/Captura-de-pantalla-2025-07-29-132633.png"
            "https://imaginatic.es/wp-content/uploads/2025/07/Captura-de-pantalla-2025-07-29-181429-1-1024x568.png"
            "https://imaginatic.es/wp-content/uploads/2025/06/2025-EnhancingComputationalThinkingSkillsInEarlyEducation.jpg"
            "https://imaginatic.es/wp-content/uploads/2025/07/Captura-de-pantalla-2025-07-29-134622-1024x390.png"
            "https://imaginatic.es/wp-content/uploads/2025/07/Captura-de-pantalla-2025-07-29-175357.png"
            "https://imaginatic.es/wp-content/uploads/2025/07/Captura-de-pantalla-2025-07-29-180136-2.png"
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            out="/tmp/imgcheck/img$i"
            echo "== $url =="
            curl -sL "$url" -o "$out"
            echo "size: $(stat -c%s "$out") bytes"
            file "$out"
            head -c 200 "$out" | strings | head -5
            echo "---"
          done
      - name: Debug sharp install
        run: |
          node -e "console.log(process.platform, process.arch)"
          npm ls sharp
          node -e "const sharp = require('sharp'); console.log(sharp.versions)"
          ls -la node_modules/@img/ 2>/dev/null || echo "no @img dir found"
      - name: Clear eleventy-img/eleventy-fetch cache
        run: |
          find . -type d -name ".cache" -not -path "*/node_modules/*"
          rm -rf .cache
      - name: Build site assets
        run: npm run all
