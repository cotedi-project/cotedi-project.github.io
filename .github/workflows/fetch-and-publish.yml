# This workflow will run the test_wp_api.py script to fetch content from the WordPress API and save it to a Markdown file. It will then commit and push the changes to the repository.

name: Python application

on:
  push:
    branches:
      - fetch_wp_content
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-content:

    runs-on: ubuntu-latest
    name: Get content of website

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      shell: bash
    - name: Get content of website
      id: get-content
      run: python3 scr/test_wp_api.py
      shell: bash
    # GitHub Actions already provides a built-in token for writing back to this repo.
    # No manual GitHub username or password is needed.
    - name: Publish generated content back to the repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/news
        if git diff --cached --quiet; then
          echo "No generated changes to commit"
          exit 0
        fi
        git commit -m "Add generated news content [skip ci]"
        git push origin HEAD:${{ github.ref_name }}
      shell: bash